<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller Level · 展示方案 Demo</title>
<style>
:root{
  --ink:#1D2129; --ink2:#606A78; --ink3:#8A939F; --ink4:#B7BDC6;
  --line:#E5E8EC; --line2:#EFF1F4;
  --page:#F0F2F5; --card:#FFF; --sunk:#F7F8FA;
  --blue:#3457D5; --blue-soft:#EBEFFC; --blue-ink:#22399B;
  --warn:#F5A623; --warn-soft:#FEF4E6;
  --good:#0E7A5E; --danger:#D0342C;
  --note:#8A4FBF; --note-soft:#F4ECFB;
  --t-starter:#6B7480; --t-starter-bg:#EDEFF2;
  --t-growing:#2A63A8; --t-growing-bg:#E6EFF9;
  --t-premium:#0E7A5E; --t-premium-bg:#E2F2EC;
  --t-top:#96620F; --t-top-bg:#FAF0DA;
  --t-elite:#6B4FA8; --t-elite-bg:#F0EAFA;
  --fs:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fs);background:var(--page);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.ono{font-family:var(--mono);font-size:11.5px;letter-spacing:-.01em}

/* ---------- demo shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{width:238px;flex:none;background:#1D2129;color:#fff;padding:22px 0 40px;position:sticky;top:0;height:100vh;overflow:auto}
.rail-hd{padding:0 20px 18px}
.rail-eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#79828E}
.rail-ttl{font-size:15.5px;font-weight:600;margin-top:6px}
.rail-sub{font-size:12px;color:#89929D;margin-top:4px}
.rail-grp{font-size:10.5px;letter-spacing:.13em;color:#6B7480;padding:16px 20px 6px;text-transform:uppercase}
.rail-btn{display:block;width:100%;text-align:left;background:none;border:0;color:#C4CAD2;padding:9px 20px;font-size:13.5px;border-left:2px solid transparent}
.rail-btn:hover{background:#282D33;color:#fff}
.rail-btn[aria-selected="true"]{background:#282D33;color:#fff;border-left-color:var(--blue);font-weight:500}
.rail-btn .idx{color:#6B7480;font-size:11px;margin-right:8px;font-variant-numeric:tabular-nums}
.rail-btn[aria-selected="true"] .idx{color:#7C93E8}
.rail-tools{border-top:1px solid #2E343B;margin-top:18px;padding:15px 20px 0}
.tool-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tool-lbl{font-size:12.5px;color:#C4CAD2}
.tool-hint{font-size:11px;color:#6B7480;line-height:1.5;margin-top:5px}
.sw{width:36px;height:20px;border-radius:20px;background:#3C434B;border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--blue)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.seg{display:flex;background:#2E343B;border-radius:6px;padding:2px;margin-top:7px}
.seg button{flex:1;background:none;border:0;color:#99A1AA;font-size:11.5px;padding:5px 2px;border-radius:4px}
.seg button[aria-selected="true"]{background:#474F58;color:#fff}
.lockmsg{font-size:11px;color:#6B7480;margin-top:7px;line-height:1.5}

.stage{flex:1;min-width:0;padding:26px 30px 80px}
.stage-hd{max-width:1180px;margin:0 auto 16px}
.stage-kicker{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
.stage-ttl{font-size:21px;font-weight:600;margin:6px 0 0;letter-spacing:-.01em}
.stage-desc{color:var(--ink2);margin:8px 0 0;max-width:70ch;font-size:13.5px}
.frame{max-width:1180px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chrome{display:flex;align-items:center;gap:7px;padding:8px 13px;background:#E9ECF0;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:#CBD1D8}
.urlbar{flex:1;margin-left:8px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:3px 10px;font-size:11.5px;color:var(--ink3)}
.scene{display:none}
.scene.on{display:block}

/* ---------- iGV console ---------- */
.igv-top{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px}
.logo-mk{width:26px;height:26px;border-radius:6px;background:#F0653A;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.logo-tx{font-size:16px;font-weight:700;letter-spacing:-.02em}
.logo-tx small{display:block;font-size:8px;letter-spacing:.16em;color:var(--ink3);font-weight:600;margin-top:-2px}
.top-r{display:flex;align-items:center;gap:14px;position:relative}
.acct{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 3px;border-radius:20px;border:1px solid transparent}
.acct:hover{background:var(--sunk);border-color:var(--line)}
.av{width:28px;height:28px;border-radius:7px;background:#8FC0F5;display:grid;place-items:center;font-size:12px;color:#1D3E6B;font-weight:700;flex:none}
.bell{position:relative;color:var(--ink2)}
.bell svg{width:18px;height:18px}
.bell b{position:absolute;top:-5px;right:-8px;background:#E5484D;color:#fff;font-size:9.5px;border-radius:9px;padding:0 4px;font-weight:600}

.igv-body{display:flex;background:var(--page);min-height:600px}
.igv-side{width:238px;flex:none;padding:16px 14px}
.side-card{background:#fff;border-radius:10px;padding:8px 0}
.si{display:flex;align-items:center;gap:11px;padding:10px 16px;font-size:13.5px;color:var(--ink)}
.si .gi{width:17px;height:17px;color:var(--ink2);flex:none}
.si.act{color:var(--blue);font-weight:500}
.si.act .gi{color:var(--blue)}
.si .chev{margin-left:auto;width:12px;height:12px;color:var(--ink4)}
.igv-main{flex:1;min-width:0;padding:16px 22px 30px}
.crumb{font-size:13px;color:var(--ink3);margin-bottom:14px}
.crumb b{color:var(--ink);font-weight:500}

.banner{display:flex;align-items:center;gap:10px;background:#EAF2FE;border-radius:8px;padding:11px 14px;font-size:13px;color:#20458C;margin-bottom:14px}
.cols2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.wcard{background:#fff;border-radius:10px;padding:18px 20px}
.wcard + .wcard{margin-top:14px}
.wtitle{font-size:15px;font-weight:600;margin-bottom:2px}
.hr{height:1px;background:var(--line2);margin:14px 0}
.statrow{display:flex}
.stat{flex:1;text-align:center;border-right:1px solid var(--line2);padding:2px 4px}
.stat:last-child{border-right:0}
.stat .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v.hot{color:#E5484D}
.stat .k{font-size:12px;color:var(--ink2);margin-top:2px}
.tabs{display:flex;gap:9px;margin:14px 0 18px}
.tab{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 15px;font-size:13px;color:var(--ink2)}
.tab.act{background:var(--blue);border-color:var(--blue);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 .k{font-size:13px;color:var(--ink2);font-weight:500}
.grid3 .v{font-size:20px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}

/* profile card (右侧) */
.pcard{background:#fff;border-radius:10px;padding:20px;text-align:center}
.pcard .bigav{width:62px;height:62px;border-radius:50%;background:#8FC0F5;display:grid;place-items:center;margin:0 auto;font-size:22px;color:#1D3E6B;font-weight:700}
.pcard .nm{font-size:15.5px;font-weight:600;margin-top:10px}
.tagrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:9px}
.tag{background:var(--warn-soft);color:#9A6410;font-size:11.5px;border-radius:4px;padding:2px 8px}
.tag.ok{background:#E4F3EC;color:#0E6A50}

.lvblock{margin-top:16px;padding-top:15px;border-top:1px solid var(--line2);text-align:left}
.lvhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qm{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--ink4);color:var(--ink3);font-size:10px;text-decoration:none;margin-left:5px;vertical-align:1px;line-height:1}
.qm:hover{border-color:var(--blue);color:var(--blue)}
.lvbadge{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:3px 8px;font-size:12px;font-weight:600}
.lvbadge .lv{font-variant-numeric:tabular-nums}
.t-starter{background:var(--t-starter-bg);color:var(--t-starter)}
.t-growing{background:var(--t-growing-bg);color:var(--t-growing)}
.t-premium{background:var(--t-premium-bg);color:var(--t-premium)}
.t-top{background:var(--t-top-bg);color:var(--t-top)}
.t-elite{background:var(--t-elite-bg);color:var(--t-elite)}
.lvscore{font-size:12.5px;color:var(--ink2);margin-top:9px}
.lvscore b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lvneed{font-size:12.5px;color:var(--ink2);margin-top:10px}
.lvneed b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:#EBEEF2;margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:3px}
.barfoot{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink3);margin-top:6px}
.lnk{color:var(--blue);text-decoration:none;font-size:12.5px}
.lnk:hover{text-decoration:underline}

.notif{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.notif:last-child{border-bottom:0}
.notif .d{color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}

/* personal center */
.pc-wrap{display:flex;background:#fff;border-radius:10px;overflow:hidden;min-height:480px}
.pc-nav{width:250px;flex:none;border-right:1px solid var(--line2);padding:12px 0}
.pc-i{display:flex;align-items:center;gap:10px;padding:13px 22px;font-size:14px;color:var(--ink)}
.pc-i.act{background:var(--blue-soft);color:var(--blue);font-weight:500;box-shadow:inset 3px 0 0 var(--blue)}
.pc-i .gi{width:16px;height:16px}
.pc-main{flex:1;min-width:0;padding:22px 26px}
.pc-h{font-size:19px;font-weight:600}
.pc-sub{color:var(--ink3);font-size:13px;margin:3px 0 16px}
.frow{display:flex;align-items:center;gap:16px;padding:15px 0;border-top:1px solid var(--line2)}
.frow-k{width:190px;flex:none;font-size:13.5px;color:var(--ink2)}
.frow-v{flex:1;min-width:0;font-size:13.5px}
.btn-o{border:1px solid #C9D3F5;background:#F5F7FE;color:var(--blue);border-radius:5px;padding:5px 16px;font-size:12.5px;flex:none}

/* level center */
.lc-hero{display:flex;align-items:center;gap:16px}
.crest{width:56px;height:56px;flex:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.crest .t{font-size:10px}
.crest .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.lc-nm{font-size:16px;font-weight:600}
.lc-sc{font-size:12.5px;color:var(--ink2);margin-top:2px}
.goal{margin-top:16px;display:flex;align-items:baseline;gap:7px}
.goal-l{font-size:12.5px;color:var(--ink2)}
.goal-v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.goal-u{font-size:13px;color:var(--ink2)}

.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bcell{border:1px solid var(--line);border-radius:9px;padding:13px 14px}
.bcell.lock{background:var(--sunk)}
.bcell.soon{border-style:dashed;background:transparent}
.bcell .bi{width:18px;height:18px;color:var(--blue)}
.bcell.lock .bi,.bcell.soon .bi{color:var(--ink4)}
.bcell .bn{font-size:13.5px;font-weight:600;margin-top:6px}
.bcell.lock .bn,.bcell.soon .bn{color:var(--ink2);font-weight:500}
.bcell .bs{font-size:11.5px;margin-top:3px;font-weight:500}
.bs.on{color:var(--good)} .bs.off{color:var(--ink3)}
.bcell .bd{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.55}
.scope{display:inline-block;background:var(--blue-soft);color:var(--blue-ink);font-size:10.5px;border-radius:3px;padding:1px 6px;margin-left:5px;font-weight:600;vertical-align:1px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 12px;font-size:12px;color:var(--ink2)}
.chip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.led{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.led-m{flex:1;min-width:0}
.led-a{font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ltag{font-size:10.5px;border-radius:3px;padding:1px 6px;font-weight:600;flex:none}
.lt-complete{background:#E9F3EC;color:#1E6B3C}
.lt-review{background:#EBEFFC;color:#22399B}
.lt-dispute{background:#FCECEA;color:#A32A22}
.lt-restore{background:#EDF6FB;color:#155E7A}
.lt-adjust{background:#F2EFF7;color:#5C4489}
.led-b{color:var(--ink3);margin-top:4px}
.led-v{font-size:14px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.plus{color:var(--good)} .minus{color:var(--danger)}
.empty{text-align:center;padding:34px 20px;color:var(--ink3);font-size:13px;border-top:1px solid var(--line2)}
.srch{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:#fff;min-width:240px}
.srch:focus-within{border-color:var(--blue)}
.srch svg{width:14px;height:14px;color:var(--ink4);flex:none}
.srch input{border:0;outline:0;flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--ink);background:transparent}
.srch input::placeholder{font-family:var(--fs);font-size:12.5px;color:var(--ink4)}
.srch button{border:0;background:none;color:var(--ink4);font-size:12px;padding:0 2px;line-height:1}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:16px;margin-top:4px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--ink2)}
.pg-total{margin-right:4px}
.pg-sel{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:5px;padding:4px 9px;color:var(--ink2)}
.pg-sel svg{width:11px;height:11px;color:var(--ink4)}
.pg-b{min-width:28px;height:28px;border:0;background:none;border-radius:5px;color:var(--ink2);font-size:12.5px;padding:0 6px}
.pg-b:hover:not([disabled]){color:var(--blue)}
.pg-b.on{color:var(--blue);font-weight:600}
.pg-b[disabled]{color:var(--ink4);cursor:default}
.pg-el{color:var(--ink4);letter-spacing:1px}
.pg-goto{display:inline-flex;align-items:center;gap:7px;margin-left:4px}
.pg-in{width:44px;height:28px;border:1px solid var(--line);border-radius:5px;text-align:center;font-size:12.5px;color:var(--ink);outline:0}
.pg-in:focus{border-color:var(--blue)}
.foot-note{font-size:11.5px;color:var(--ink3);margin:12px 0 0;line-height:1.6}

/* menu */
.menu{position:absolute;top:40px;right:0;width:262px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,25,30,.15);padding:6px;z-index:6}
.menu-hd{padding:11px 11px 13px;border-bottom:1px solid var(--line2);margin-bottom:5px}
.menu-nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.menu-id{font-size:11px;color:var(--ink3);margin-top:4px;font-variant-numeric:tabular-nums}
.menu-lv{margin-top:11px;background:var(--sunk);border-radius:7px;padding:10px}
.menu-lv-t{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.menu-lv-t b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.menu-i{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;font-size:13px}
.menu-i:hover{background:var(--sunk)}
.menu-i .gi{width:15px;height:15px;color:var(--ink2)}
.menu-sep{height:1px;background:var(--line2);margin:5px 0}

/* article */
.artwrap{padding:32px 40px 46px;max-width:780px;margin:0 auto}
.art-eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);font-weight:700}
.art-h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:9px 0 8px;line-height:1.35}
.art-lead{font-size:14.5px;color:var(--ink2);line-height:1.75;margin:0 0 6px}
.art-meta{font-size:12px;color:var(--ink4);padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:24px}
.art-h2{font-size:16px;font-weight:600;margin:28px 0 10px}
.art-h2 .no{color:var(--ink4);font-weight:500;margin-right:8px;font-variant-numeric:tabular-nums}
.artwrap p{margin:0 0 12px;line-height:1.8;color:#2E343C}
table.at{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:13px}
table.at th{text-align:left;background:var(--sunk);color:var(--ink2);font-weight:600;font-size:12.5px;padding:9px 12px;border:1px solid var(--line)}
table.at td{padding:9px 12px;border:1px solid var(--line);vertical-align:top}
table.at td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.callout{background:var(--sunk);border-left:3px solid var(--blue);padding:13px 16px;margin:15px 0;border-radius:0 6px 6px 0}
.callout p:last-child{margin-bottom:0}
.faq{border-top:1px solid var(--line2);padding:13px 0}
.faq-q{font-weight:600;font-size:13.5px;margin-bottom:5px}
.faq-a{color:#2E343C;font-size:13.5px;line-height:1.8}


.specwrap{max-width:1180px;margin:0 auto}
table.sp{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13px}
table.sp th{text-align:left;background:#1D2129;color:#fff;font-weight:500;font-size:12px;padding:11px 14px;letter-spacing:.03em}
table.sp td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
table.sp tr:last-child td{border-bottom:0}
.sp-t{background:var(--sunk);border-right:1px solid var(--line2)}
.sp-en{color:var(--ink3);font-size:12px;margin-top:2px}
.sp-c{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--ink2);background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-top:6px}
.sp-t .sp-c{background:#fff}
.sp-v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-d{color:var(--ink2);line-height:1.65}
.spnote{background:#fff;border-radius:10px;padding:18px 20px;margin-top:14px}
.spnote b{font-size:13.5px}
.spnote p{margin:9px 0 0;font-size:13px;color:var(--ink2);line-height:1.75}
.spnote code{font-family:var(--mono);font-size:11.5px;background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:0 4px}


[data-jump]{cursor:pointer}
a.lnk[data-jump]:hover,.qm[data-jump]:hover{text-decoration:underline}
.menu-i[data-jump],.si[data-jump]{cursor:pointer}
.si[data-jump]:hover{color:var(--blue)}
.si[data-jump]:hover .gi{color:var(--blue)}
.scene.landed .frame,.scene.landed .specwrap{animation:land .5s ease}
@keyframes land{from{box-shadow:0 0 0 3px rgba(52,87,213,.28)}to{box-shadow:0 0 0 3px rgba(52,87,213,0)}}
@media (prefers-reduced-motion:reduce){.scene.landed .frame,.scene.landed .specwrap{animation:none}}

/* annotations */
.anno{position:relative}
body.noteoff .pin{display:none}

const OPFX = "SO2087851550363795";
const pad2 = v => String(v).padStart(2,"0");
function fmtTs(ts){
  const x=new Date(ts);
  return x.getUTCFullYear()+"-"+pad2(x.getUTCMonth()+1)+"-"+pad2(x.getUTCDate())+
    " "+pad2(x.getUTCHours())+":"+pad2(x.getUTCMinutes());
}
function seeded(seed){let s=seed;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}
function buildLedger(){
  const r=seeded(20260813), out=[], HR=3600000, DAY=86400000;
  const t0=Date.UTC(2026,7,13,9,0);
  for(let i=0;i<16;i++){
    const o=OPFX+(457-i*7);
    const base=t0-Math.round(i*1.35*DAY);
    const add=(k,type,v,off)=>out.push({o,k,type,v,ts:base+Math.round(off*HR)});
    let earned=1; add("receive","complete","+1",0);
    if(r()>0.2){ add("ontime","complete","+1",0.3); earned+=1; }
    const rv=r();
    if(rv>0.42){ add("good","review","+1",5); earned+=1; }
    else if(rv<0.14){ add("bad","review","−1",5); earned-=1; }
    if(r()<0.24 && earned>0){
      add("aftersale","dispute","−"+earned,27);
      const back=r();
      if(back<0.6) add(back<0.24?"reject":(back<0.42?"cancel":"close"),"restore","+"+earned,52);
    }
  }
  out.push({o:"",k:"credit",type:"adjust",v:"+5",ts:Date.UTC(2026,7,5,15,30)});
  out.push({o:OPFX+"312",k:"debit",type:"adjust",v:"−3",ts:Date.UTC(2026,6,29,11,10)});
  return out.sort((a,b)=>b.ts-a.ts);
}

/* ---------- ledger ---------- */
const PER = 10;
function matched(){
  const x=d(); const q=query.trim();
  return x.ledger.filter(r=>(filter==="all"||r.type===filter) && (!q||r.o.includes(q)));
}
function ledgerRows(){
  const n=t(), all=matched();
  if(!all.length) return '<div class="empty">'+(query||filter!=="all"?n.noResult:n.emptyLedger)+'</div>';
  const start=(page-1)*PER;
  return all.slice(start,start+PER).map(r=>'<div class="led"><div class="led-m"><div class="led-a">'+
    '<span class="ltag lt-'+r.type+'">'+n.tags[r.type]+'</span><span style="font-weight:500">'+n.acts[r.k]+'</span></div>'+
    '<div class="led-b mini">'+(r.o?'<span class="ono">'+n.orderCol+' '+r.o+'</span> · ':'')+
    '<span class="num" style="font-size:11.5px">'+fmtTs(r.ts)+'</span></div></div>'+
    '<div class="led-v '+(r.v.startsWith("+")?"plus":"minus")+'">'+r.v+'</div></div>').join("");
}
function pager(){
  const n=t(), total=matched().length, pages=Math.max(1,Math.ceil(total/PER));
  if(!total) return "";
  let nums=[];
  if(pages<=7){ for(let i=1;i<=pages;i++) nums.push(i); }
  else{
    nums=[1,2,3,4,5,"…",pages];
    if(page>4) nums = page>pages-4 ? [1,"…",pages-4,pages-3,pages-2,pages-1,pages]
                                   : [1,"…",page-1,page,page+1,"…",pages];
  }
  return '<div class="pager">'+
   '<span class="pg-total num">'+n.total.replace("%n",total)+'</span>'+
   '<span class="pg-sel">'+n.perPage+'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span>'+
   '<button class="pg-b" data-go="'+(page-1)+'"'+(page===1?' disabled':'')+'>‹</button>'+
   nums.map(v=>v==="…"?'<span class="pg-el">···</span>':
     '<button class="pg-b num'+(v===page?' on':'')+'" data-go="'+v+'">'+v+'</button>').join("")+
   '<button class="pg-b" data-go="'+(page+1)+'"'+(page===pages?' disabled':'')+'>›</button>'+
   '<span class="pg-goto">'+n.goTo+'<input class="pg-in num" id="goInput" value="'+page+'">'+n.pageU+'</span>'+
   '</div>';
}
function ledger(){
  const n=t(), keys=["all","complete","review","dispute","restore","adjust"];
  return '<div class="wcard anno" data-note="行为是封闭枚举，共 11 种，分属 5 个类型 —— 标题不再是自定义文案，卖家和客服看到的措辞完全一致">'+

<p>等级发生变化时，我们会通过站内信通知你，你可以在信用分明细中按订单号核对具体变动。</p>

<h2 class="art-h2"><span class="no">05</span>常见问题</h2>
<div class="faq"><div class="faq-q">刚入驻，多久能升到 L2？</div><div class="faq-a">L1 升 L2 只需 5 分，通常几笔顺利完成的订单就可以。新手阶段升级所需分数很低，Level Center 会显示预计还需多少单。</div></div>
<div class="faq"><div class="faq-q">为什么我的分数变少了？</div><div class="faq-a">通常是某笔订单发生了退款、售后或纠纷，该订单此前获得的分数被扣回。在信用分明细中筛选「售后与纠纷」即可找到对应记录。若纠纷之后撤销，分数会以「分数恢复」重新计入。</div></div>
<div class="faq"><div class="faq-q">为什么这笔订单只加了 1 分？</div><div class="faq-a">准时递送分只适用于你自行履约的订单，好评分只统计买家主动给出的评价。由平台自动递送、或买家未主动评价的订单，通常只有确认收货的 1 分。</div></div>
<div class="faq"><div class="faq-q">预计单数为什么会变？</div><div class="faq-a">它根据你近期的平均每单得分估算。当你的准时率、好评率提升时，平均每单得分变高，需要的订单数就会减少。</div></div>
<div class="faq"><div class="faq-q">等级会按品类分开计算吗？</div><div class="faq-a">不会。你的所有订单共同计入同一个等级。付费延长质保标签目前只适用于 ACC 品类，但等级本身不分品类。</div></div>`,
en:`<div class="art-eyebrow">Help Center · Seller rules</div>
<h1 class="art-h1">What Seller Level is, and how to move up</h1>
<p class="art-lead">Your Seller Level reflects the long-term quality of how you sell on iGV. Every order you complete to a buyer's satisfaction earns Credit Score; once your score reaches a threshold, your level goes up. Higher levels come with more selling benefits.</p>
<p class="art-meta">Last updated: 2026-08-13</p>

<h2 class="art-h2"><span class="no">01</span>How Credit Score is earned</h2>
<p>Credit Score is settled per order. A single order can earn up to 3 points. Exactly eleven actions affect your score, grouped into five types:</p>
<table class="at"><thead><tr><th style="width:20%">Type</th><th style="width:20%">Title</th><th style="width:14%">Score</th><th>Notes</th></tr></thead><tbody>
<tr><td rowspan="2">Order completed</td><td>Order received</td><td class="n" style="color:var(--good);font-weight:600">+1</td><td>Counted as soon as the order completes — no need to wait for the warranty period to end</td></tr>
<tr><td>On-time delivery</td><td class="n" style="color:var(--good);font-weight:600">+1</td><td>Applies to orders you fulfil yourself; auto-delivered orders don't count</td></tr>
<tr><td rowspan="2">Buyer review</td><td>Positive review</td><td class="n" style="color:var(--good);font-weight:600">+1</td><td>Only reviews the buyer writes themselves count; system-generated ones don't</td></tr>
<tr><td>Negative review</td><td class="n" style="color:var(--danger);font-weight:600">−1</td><td>Same as above</td></tr>
<tr><td>After-sales &amp; dispute</td><td>After-sales opened</td><td class="n" style="color:var(--danger);font-weight:600">Cleared</td><td>A refund, after-sales case or dispute clears the order's credit score. It is cleared only once per order — escalating to a dispute does not deduct again</td></tr>
<tr><td rowspan="3">Score restored</td><td>After-sales closed</td><td class="n" style="color:var(--good);font-weight:600">Restored</td><td>The refund or after-sales case closed with no seller fault</td></tr>
<tr><td>Dispute rejected</td><td class="n" style="color:var(--good);font-weight:600">Restored</td><td>The dispute was decided in your favour</td></tr>
<tr><td>Dispute cancelled</td><td class="n" style="color:var(--good);font-weight:600">Restored</td><td>The buyer cancelled the dispute</td></tr>
<tr><td rowspan="3">Manual adjustment</td><td>Platform credit</td><td class="n" style="color:var(--good);font-weight:600">+n</td><td>Dispute compensation or make-good after a system fault</td></tr>
<tr><td>Policy penalty</td><td class="n" style="color:var(--danger);font-weight:600">−n</td><td>Order brushing, fake shipping and similar violations</td></tr>
<tr><td>Data correction</td><td class="n">±n</td><td>Retroactive fix for a scoring error</td></tr>
</tbody></table>
<div class="callout"><p>Credit Score history in the Level Center logs every change by order number. You can filter by type or search directly by order number. Your order list and order details also show the score for each order.</p></div>

<h2 class="art-h2"><span class="no">02</span>How levels are calculated</h2>
<p>Levels start at L1 with no cap. The score needed per level increases as you move up:</p>
<table class="at"><thead><tr><th style="width:26%">Level</th><th style="width:26%">Score per level</th><th>Stage</th></tr></thead><tbody>
<tr><td class="n">L1 – L20</td><td class="n">5 – 50 pts</td><td>Starter</td></tr>
<tr><td class="n">L21 – L50</td><td class="n">100 pts</td><td>Growing</td></tr>
<tr><td class="n">L51 – L100</td><td class="n">200 pts</td><td>Premium</td></tr>
<tr><td class="n">L101 – L200</td><td class="n">1,000 pts</td><td>Top</td></tr>
<tr><td class="n">L201 and above</td><td class="n">3,000 pts</td><td>Elite</td></tr>
</tbody></table>
<p>The Level Center shows how many points you still need, plus an estimate of how many more orders that works out to, based on your recent average score per order. That order estimate will shift as your performance changes.</p>

<h2 class="art-h2"><span class="no">03</span>What your level gets you</h2>
<p>Benefits activate automatically once you reach the threshold — no application needed.</p>
<table class="at"><thead><tr><th style="width:32%">Benefit</th><th style="width:22%">Threshold</th><th>What it does</th></tr></thead><tbody>
<tr><td>Traffic support</td><td>No threshold</td><td>The higher your level, the more exposure your listings get in search and recommendations</td></tr>
<tr><td>Extended warranty label</td><td class="n">L20 · ACC only</td><td>Offer a paid 90-day / 180-day extended warranty label on ACC listings to build buyer trust and lift conversion</td></tr>
</tbody></table>
<p>More benefits — commission incentives, withdrawal fee discounts — are in planning. They'll appear in the Level Center when they launch, and we'll notify you by message.</p>

<h2 class="art-h2"><span class="no">04</span>About level drops</h2>
<p>Credit Score is reclaimed when refunds, after-sales cases, disputes or negative reviews occur. If your total score falls below what your current level requires, your level drops accordingly.</p>
<div class="callout"><p><b>Benefits already in effect are not affected.</b> Benefits are determined by your level at the moment the buyer places the order. If a buyer bought a listing with an extended warranty label while you were L57, that warranty stays valid even if you later drop below L20 — but you won't be able to apply the label to new listings until your level recovers.</p></div>
<p>We'll message you whenever your level changes, and you can reconcile the exact movements by order number in your Credit Score history.</p>

<h2 class="art-h2"><span class="no">05</span>FAQ</h2>
<div class="faq"><div class="faq-q">I just joined — how long until L2?</div><div class="faq-a">L1 to L2 takes only 5 points, usually a handful of smoothly completed orders. Thresholds are low at the Starter stage, and the Level Center shows roughly how many more orders you need.</div></div>
<div class="faq"><div class="faq-q">Why did my score go down?</div><div class="faq-a">Usually because an order went to refund, after-sales or dispute, and the score it had earned was reclaimed. Filter your Credit Score history by "After-sales &amp; dispute" to find it. If the dispute is later withdrawn, the score comes back as "Score restored".</div></div>
<div class="faq"><div class="faq-q">Why did this order only earn 1 point?</div><div class="faq-a">The on-time delivery point applies only to orders you fulfil yourself, and the review point counts only reviews the buyer writes themselves. Auto-delivered orders, or orders with no buyer review, typically earn just the 1 point for confirmed receipt.</div></div>
<div class="faq"><div class="faq-q">Why does the order estimate change?</div><div class="faq-a">It's based on your recent average score per order. As your on-time rate and positive review rate improve, your average rises and fewer orders are needed.</div></div>
<div class="faq"><div class="faq-q">Is level calculated per category?</div><div class="faq-a">No. All your orders count toward one level. The extended warranty label currently applies to the ACC category only, but the level itself is not split by category.</div></div>`

function renderSpec(){
  let body="";
  SPEC.forEach(g=>{
    g.rows.forEach((r,i)=>{
      body+='<tr>'+(i===0?'<td rowspan="'+g.rows.length+'" class="sp-t"><span class="ltag lt-'+g.cls+'">'+g.tz+'</span>'+
        '<div class="sp-en">'+g.te+'</div><code class="sp-c">'+g.t+'</code></td>':'')+
        '<td><b>'+r.z+'</b><div class="sp-en">'+r.e+'</div><code class="sp-c">'+r.c+'</code></td>'+
        '<td class="sp-v '+r.vc+'">'+r.v+'</td>'+
        '<td class="sp-d">'+r.tz+'<div class="sp-en">'+r.te+'</div></td></tr>';
    });
  });
  document.getElementById("v-spec").innerHTML=
   '<div class="specwrap"><table class="sp"><thead><tr>'+
   '<th style="width:16%">类型 type</th><th style="width:20%">标题 title</th><th style="width:8%">分值</th><th>触发时机</th>'+
   '</tr></thead><tbody>'+body+'</tbody></table>'+
   '<div class="spnote"><b>落地约束</b>'+
   '<p>1 · 明细表只存 <code>type</code> + <code>title</code> 两个 code，加上 <code>delta</code>、<code>order_no</code>、<code>created_at</code>。文案在前端按当前语言渲染，卖家改语言后历史记录随之切换。</p>'+
   '<p>2 · 标题里不出现数字。<code>−n</code> 的 n 是该订单当时的实际得分（1–3 分），由后端计算后放在独立的 delta 字段。一旦把数字拼进标题就没法做多语言。</p>'+
   '<p>3 · 一行 = 一个行为。确认收货和准时递送是两条 +1，不合并成一条 +2 —— 合并会迫使标题变成拼接句子。</p>'+
   '<p>4 · 恢复类的三个 code 分值相同、语义不同，不要合并。卖家关心的是「凭什么还我」，客服排查时也靠这个区分责任归属。</p></div></div>';
}
function renderArticle(){
  document.getElementById("v-article").innerHTML =
  '<div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="urlbar">seller.igv.com/help/seller-level</span></div>'+
  '<article class="artwrap">'+ART[lang]+'</article>';
}

/* ================= wiring ================= */
function refreshLedger(){
  document.getElementById("ledrows").innerHTML=ledgerRows();
  document.getElementById("ledpager").innerHTML=pager();
  bindPager();
}
function bindPager(){
  const box=document.getElementById("ledpager"); if(!box) return;
  const pages=Math.max(1,Math.ceil(matched().length/PER));
  box.querySelectorAll(".pg-b").forEach(b=>b.addEventListener("click",()=>{
    const g=parseInt(b.dataset.go,10);
    if(isNaN(g)||g<1||g>pages||g===page) return;
    page=g; refreshLedger();
  }));
  const gi=document.getElementById("goInput");
  if(gi) gi.addEventListener("keydown",e=>{
    if(e.key!=="Enter") return;
    const g=parseInt(gi.value,10);
    if(isNaN(g)||g<1||g>pages){ gi.value=page; return; }
    page=g; refreshLedger();
  });
}
function bindLedger(){
  const chips=document.getElementById("chips"); if(!chips) return;
  chips.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    filter=c.dataset.f; page=1;
    chips.querySelectorAll(".chip").forEach(y=>y.setAttribute("aria-selected",String(y.dataset.f===filter)));
    refreshLedger();
  }));
  const si=document.getElementById("srchIn");
  if(si) si.addEventListener("input",()=>{
    query=si.value; page=1;
    document.getElementById("ledrows").innerHTML=ledgerRows();
    document.getElementById("ledpager").innerHTML=pager();
    bindPager();
    const x=document.getElementById("srchX");
    if(x) x.addEventListener("click",()=>{query="";page=1;renderCenter();pins();});
  });
  const sx=document.getElementById("srchX");
  if(sx) sx.addEventListener("click",()=>{query="";page=1;renderCenter();pins();});
  bindPager();
}
function pins(){
  ["home","profile","center","menu"].forEach(id=>{
    const sc=document.getElementById("sc-"+id), list=document.getElementById("notes-"+id);
    if(!list) return; list.innerHTML="";
    sc.querySelectorAll(".anno[data-note]").forEach((el,i)=>{
      const p=document.createElement("span"); p.className="pin"; p.textContent=i+1; el.appendChild(p);
      const li=document.createElement("li"); li.textContent=el.dataset.note; list.appendChild(li);
    });
  });
}
function renderAll(){
  renderHome(); renderProfile(); renderCenter(); renderMenu(); renderSpec(); renderArticle(); pins();
  const lb=document.getElementById("langBtn");
  if(lb) lb.addEventListener("click",()=>setLang(lang==="zh"?"en":"zh"));
  Object.keys(STAGE).forEach(k=>{
    document.getElementById("t-"+k).textContent=STAGE[k][0];
    document.getElementById("d-"+k).textContent=STAGE[k][1];
  });
}
function setLang(l){
  lang=l; document.documentElement.lang = l==="zh"?"zh-CN":"en";
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.l===l)));
  renderAll();
}
document.querySelectorAll("#lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
document.querySelectorAll("#persona button").forEach(b=>b.addEventListener("click",()=>{
  persona=b.dataset.p; filter="all"; query=""; page=1;
  document.querySelectorAll("#persona button").forEach(y=>y.setAttribute("aria-selected",String(y.dataset.p===persona)));
  renderAll();
}));
function goScene(name){
  const sc=document.getElementById("sc-"+name); if(!sc) return;
  document.querySelectorAll(".rail-btn").forEach(y=>y.setAttribute("aria-selected",String(y.dataset.scene===name)));
  document.querySelectorAll(".scene").forEach(s=>s.classList.remove("on"));
  sc.classList.add("on");
  window.scrollTo(0,0);
  sc.classList.remove("landed"); void sc.offsetWidth; sc.classList.add("landed");
}
document.querySelectorAll(".rail-btn").forEach(b=>b.addEventListener("click",()=>goScene(b.dataset.scene)));
document.addEventListener("click",e=>{
  const el=e.target.closest?e.target.closest("[data-jump]"):null;
  if(!el) return;
  e.preventDefault();
  goScene(el.dataset.jump);
});
const noteSw=document.getElementById("noteSw");
noteSw.addEventListener("click",()=>{
  const on=noteSw.getAttribute("aria-checked")==="true";
  noteSw.setAttribute("aria-checked",String(!on));
  document.body.classList.toggle("noteon",!on);
  document.body.classList.toggle("noteoff",on);
});
renderAll();
</script>
